name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -race -count=1

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=${{ github.sha }} -t urban-crisis-evacuation:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 urban-crisis-evacuation:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/api/v1/health && break; sleep 1; done
          curl -fs "http://localhost:8080/api/v1/evacuation/plan?zone=nasimi" | head -c 300
          docker logs app
