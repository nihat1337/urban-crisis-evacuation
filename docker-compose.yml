services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crisis
      POSTGRES_PASSWORD: crisis
      POSTGRES_DB: crisis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisis -d crisis"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-compose}
    image: urban-crisis-evacuation:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://crisis:crisis@db:5432/crisis?sslmode=disable
      STORE_FALLBACK: "true"
      DISPATCHER_API_KEY: ${DISPATCHER_API_KEY:-dispatcher-secret}
      ROUTING_MODE: ${ROUTING_MODE:-auto}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      # Optional Google Maps Platform keys (put them in .env — never commit them).
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_DIRECTIONS_API_KEY: ${GOOGLE_DIRECTIONS_API_KEY:-}
      CRISIS_WINDOW: ${CRISIS_WINDOW:-5m}
      CRISIS_RADIUS_M: ${CRISIS_RADIUS_M:-500}
      CRISIS_MIN_SIGNALS: ${CRISIS_MIN_SIGNALS:-4}
      SHELTER_ALERT_PCT: ${SHELTER_ALERT_PCT:-95}
      SHELTER_WARN_PCT: ${SHELTER_WARN_PCT:-90}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      # Security / anti-flood (jury change #4)
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-9f1c}
      DISPATCH_USERS: ${DISPATCH_USERS:-admin:admin123:admin,operator:operator123:operator,viewer:viewer123:viewer}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SOS_RATE_PER_MIN: ${SOS_RATE_PER_MIN:-10}
      SOS_BURST: ${SOS_BURST:-5}
      SOS_DEDUPE_WINDOW: ${SOS_DEDUPE_WINDOW:-30s}
      SOS_FLOOD_THRESHOLD: ${SOS_FLOOD_THRESHOLD:-60}
      DEFAULT_LANG: ${DEFAULT_LANG:-az}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-8080}}
      NOTIFY_PROVIDER: ${NOTIFY_PROVIDER:-simulated}
      # SMS evacuation module: DEMO_MODE=1 prefixes every SMS with [DEMO/TEST];
      # APP_ENV=production turns off the admin-only /dev/seed and /dev/incidents helpers.
      DEMO_MODE: ${DEMO_MODE:-0}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

volumes:
  dbdata:
